<footer class="footer">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row my-3">
            <div class="col-6">
                <div class="text-muted">
                    <i>Last updated: {{ "now" | date: "%b %Y" }}</i>
                </div>
            </div>
            <div class="col-6">
                <div class="text-right text-muted">
                    {{ site.data.display.footer_text }}
                </div>
            </div>
        </div>
    </div>
</footer>
<!-- All-time counter. Vercount fills any of #vercount_value_{site_pv,site_uv,page_pv}
     that exist and skips the ones that don't, so listing only site_pv here shows
     just the total; unique visitors keep being recorded either way and can be
     surfaced later by adding <span id="vercount_value_site_uv">. -->
<div class="text-center text-muted pb-4">
    Total visits: <span id="vercount_value_site_pv">&ndash;</span>
</div>
<script defer src="https://events.vercount.one/js"></script>

<!-- MapMyVisitors, map hidden. Requesting map.png is what records the visit, so the
     location dashboard keeps filling in with nothing rendered here. To show the map
     again, swap this for a <script id="mapmyvisitors" src="//mapmyvisitors.com/map.js?d=…">
     tag; omit `w` so the widget clamps itself to [180, 300]px (`w=a` is unbounded and
     fills the viewport). Its own count is a rolling 30-day window, not an all-time
     total -- that is why the line above uses Vercount instead. -->
<img src="//mapmyvisitors.com/map.png?d=Jflifk4djQtXQzjI3EMQVq4x-CkZDN958t8EqmYZUKM&cl=ffffff"
     width="1" height="1" alt="" />
