<footer class="footer">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row my-3">
            <div class="col-6">
                <div class="text-muted">
                    <i>Last updated: {{ "now" | date: "%b %Y" }}</i>
                </div>
            </div>
            <div class="col-6">
                <div class="text-right text-muted">
                    {{ site.data.display.footer_text }}
                </div>
            </div>
        </div>
    </div>
</footer>
<!-- Visitor tracking with the map hidden. Requesting map.png is what records the
     visit, so stats keep accruing on the MapMyVisitors dashboard even though
     nothing is rendered. To show the map again, swap this back for the map.js
     widget (script tag with id="mapmyvisitors" and a pixel width, e.g. w=300). -->
<img src="//mapmyvisitors.com/map.png?d=Jflifk4djQtXQzjI3EMQVq4x-CkZDN958t8EqmYZUKM&cl=ffffff"
     width="1" height="1" alt="" />
